services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: assets
      POSTGRES_DB: assets
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - asset-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assets -d assets"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m
  app:
    build: .
    image: company-assets:1.0.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://assets:${POSTGRES_PASSWORD}@db:5432/assets
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      APP_ORIGIN: https://124.221.244.227,https://tencent.geneecho.top
      BASE_PATH: /asset-manager/
      COOKIE_SECURE: "true"
      TRUST_PROXY: "true"
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:4318:4318"
    volumes:
      - ./data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4318/asset-manager/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 384m
volumes:
  asset-postgres:
