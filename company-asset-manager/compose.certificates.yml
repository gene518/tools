services:
  certificates:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./deploy/Caddyfile.certificates:/etc/caddy/Caddyfile:ro
      - ./certificates:/data
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
